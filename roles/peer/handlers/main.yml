---
# ORDER IN THIS FILE IS THE ORDER THEY RUN IN. Ansible runs handlers in the
# order they are defined, not the order they were notified, and that is load
# bearing here: the kill switch must be reloaded before the tunnel moves, and
# the tunnel must be up before the proxy that rides it reconnects.

- name: Reload the peer kill switch
  ansible.builtin.systemd:
    name: peer-killswitch.service
    state: reloaded
    daemon_reload: true

- name: Restart the peer tunnel
  ansible.builtin.systemd:
    name: "{{ peer_unit }}"
    state: restarted
    daemon_reload: true

- name: Restart the socks proxy
  ansible.builtin.systemd:
    name: socks-peer.service
    state: restarted
    daemon_reload: true

- name: Restart the peer's tunnel
  ansible.builtin.systemd:
    name: "wg-quick@{{ peer_remote_interface }}.service"
    state: restarted
    daemon_reload: true
  delegate_to: peer_remote
  become: false
